<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>glosa README frame</title>
    <style>
      :root {
        --radius: 12px;
        --ui: -apple-system, "SF Pro Text", system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #fff; }

      #stage {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(120% 100% at 18% 0%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 55%),
          linear-gradient(158deg, #efece4 0%, #e6e2d8 52%, #dedad0 100%);
      }
      #stage[data-bg="plain"] { background: #efece4; }

      /* Dark stage, for the README's prefers-color-scheme: dark sources. */
      #stage[data-theme="dark"] {
        background:
          radial-gradient(120% 100% at 18% 0%, rgba(150, 144, 128, 0.2), rgba(0, 0, 0, 0) 55%),
          linear-gradient(158deg, #2a2720 0%, #221f19 52%, #1b1913 100%);
      }
      #stage[data-theme="dark"][data-bg="plain"] { background: #262319; }

      .win {
        position: absolute;
        border-radius: var(--radius);
        overflow: hidden;
        background: #fff;
        box-shadow:
          0 0 0 0.5px rgba(30, 27, 22, 0.16),
          0 2px 5px -1px rgba(30, 27, 22, 0.12),
          0 14px 28px -10px rgba(30, 27, 22, 0.22),
          0 40px 76px -24px rgba(30, 27, 22, 0.4);
      }
      #stage[data-theme="dark"] .win {
        box-shadow:
          0 0 0 0.5px rgba(255, 252, 245, 0.14),
          0 2px 5px -1px rgba(0, 0, 0, 0.5),
          0 14px 28px -10px rgba(0, 0, 0, 0.55),
          0 40px 76px -24px rgba(0, 0, 0, 0.7);
      }

      /* ---- window chrome ------------------------------------------------ */
      .bar {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 40px;
        padding: 0 16px;
        border-bottom: 1px solid rgba(30, 27, 22, 0.1);
        background: linear-gradient(180deg, #fbfaf8, #f2f0eb);
        flex: none;
      }
      .lights { display: flex; gap: 8px; flex: none; }
      .lights i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: block;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.12);
      }
      .lights i:nth-child(1) { background: #ff5f57; }
      .lights i:nth-child(2) { background: #febc2e; }
      .lights i:nth-child(3) { background: #28c840; }

      .url {
        flex: 1;
        display: flex;
        justify-content: center;
      }
      .url span {
        font: 12.5px/1 var(--mono);
        color: #55504a;
        background: #fff;
        border: 1px solid rgba(30, 27, 22, 0.12);
        border-radius: 13px;
        padding: 7px 18px;
        letter-spacing: 0.1px;
        max-width: 70%;
        overflow: hidden;
        white-space: nowrap;
      }
      .spacer { width: 52px; flex: none; }

      /* dark-stage browser chrome (the terminal window is dark in both stages) */
      #stage[data-theme="dark"] .win:not(.term) { background: #17150f; }
      #stage[data-theme="dark"] .win:not(.term) .bar {
        background: linear-gradient(180deg, #2b2825, #211f1c);
        border-bottom: 1px solid rgba(0, 0, 0, 0.5);
      }
      #stage[data-theme="dark"] .url span {
        color: #b8b0a5;
        background: rgba(0, 0, 0, 0.35);
        border-color: rgba(255, 252, 245, 0.12);
      }

      /* terminal variant */
      .win.term { background: #100f0d; }
      .win.term .bar {
        background: linear-gradient(180deg, #2b2825, #211f1c);
        border-bottom: 1px solid rgba(0, 0, 0, 0.5);
      }
      .win.term .title {
        flex: 1;
        text-align: center;
        font: 12.5px/1 var(--ui);
        font-weight: 500;
        color: #a49c92;
        letter-spacing: 0.1px;
      }

      /* ---- shot viewport (crops a screenshot) --------------------------- */
      .shot { position: relative; overflow: hidden; }
      .shot img { position: absolute; display: block; image-rendering: -webkit-optimize-contrast; }

      /* ---- typeset terminal transcript ---------------------------------- */
      .tty {
        font: 13px/1.62 var(--mono);
        color: #ddd6cb;
        padding: 18px 20px 20px;
        white-space: pre-wrap;
      }
      .tty .l { display: block; }
      .tty .dim { color: #7e766c; }
      .tty .user { color: #cfc7bb; }
      .tty .dot { color: #d8d2c8; }
      .tty .tool { color: #e6e0d6; }
      .tty .ok { color: #8fae72; }
      .tty .del { color: #d98a76; }
      .tty .add { color: #8fae72; }
      .tty .glosa { color: #b3b06a; }
      .tty .spacer { height: 9px; display: block; }
      .tty b { font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      const spec = JSON.parse(new URLSearchParams(location.search).get("spec"));
      const stage = document.getElementById("stage");
      stage.style.width = spec.w + "px";
      stage.style.height = spec.h + "px";
      if (spec.bg) stage.dataset.bg = spec.bg;
      if (spec.theme) stage.dataset.theme = spec.theme;

      const el = (tag, cls, html) => {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (html != null) n.innerHTML = html;
        return n;
      };

      for (const w of spec.windows) {
        const win = el("div", "win" + (w.kind === "terminal" ? " term" : ""));
        win.style.left = w.x + "px";
        win.style.top = w.y + "px";
        win.style.width = w.w + "px";
        if (w.z != null) win.style.zIndex = String(w.z);

        const bar = el("div", "bar");
        bar.append(el("div", "lights", "<i></i><i></i><i></i>"));
        if (w.kind === "terminal") {
          bar.append(el("div", "title", w.title || ""));
          bar.append(el("div", "spacer"));
        } else {
          const url = el("div", "url");
          url.append(el("span", null, w.url || ""));
          bar.append(url);
          bar.append(el("div", "spacer"));
        }
        win.append(bar);

        if (w.kind === "terminal") {
          const tty = el("div", "tty");
          for (const line of w.lines) {
            if (line === "") {
              tty.append(el("span", "spacer"));
            } else {
              tty.append(el("span", "l", line));
            }
          }
          win.append(tty);
        } else {
          const shot = el("div", "shot");
          const scale = w.scale ?? 1;
          const crop = w.crop ?? { x: 0, y: 0, w: w.imgW, h: w.imgH };
          shot.style.width = Math.round(crop.w * scale) + "px";
          shot.style.height = Math.round(crop.h * scale) + "px";
          const img = el("img");
          img.src = w.img;
          img.style.width = Math.round(w.imgW * scale) + "px";
          img.style.left = Math.round(-crop.x * scale) + "px";
          img.style.top = Math.round(-crop.y * scale) + "px";
          shot.append(img);
          win.append(shot);
        }
        stage.append(win);
      }
      window.__ready = true;
    </script>
  </body>
</html>
