name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full_checks:
        description: Run full checks (manual runs are always full)
        type: boolean
        default: false
      stability_repetitions:
        description: Number of fresh-process stability runs
        type: choice
        options: ['2', '10']
        default: '2'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: macos-14
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      whole: ${{ steps.plan.outputs.whole }}
      app: ${{ steps.plan.outputs.app }}
      repetitions: ${{ steps.plan.outputs.repetitions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - id: plan
        env:
          TEST_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          TEST_FORCE_FULL: ${{ inputs.force_full_checks }}
          TEST_STABILITY_REPETITIONS: ${{ inputs.stability_repetitions }}
        run: |
          mkdir -p .context/test-results
          bun run scripts/test-plan.ts prepare > .context/test-results/plan.json
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-plan
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  quality:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint full repository
        if: needs.prepare.outputs.profile == 'full'
        run: bun run lint
      - name: Typecheck
        if: needs.prepare.outputs.profile == 'full'
        run: bun run typecheck
      - name: Formatting
        run: bun run format:check
      - name: Audit production dependency licenses
        if: needs.prepare.outputs.profile == 'full'
        run: bun run audit:licenses
      - name: Inspect and smoke-test npm tarball
        run: bun run package:check

  docs:
    needs: prepare
    if: needs.prepare.outputs.profile == 'docs'
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:docs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-docs
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  tests:
    needs: prepare
    if: needs.prepare.outputs.profile == 'full'
    runs-on: macos-14
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [ci-1, ci-2, ci-3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Execute coverage partition
        env:
          TEST_PARTITION: ${{ matrix.profile }}
        run: bun run scripts/test-runner.ts "$TEST_PARTITION"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-${{ matrix.profile }}
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  stability:
    needs: prepare
    if: needs.prepare.outputs.profile == 'full'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Repeat ownership and lifecycle checks
        env:
          TEST_REPETITIONS: ${{ needs.prepare.outputs.repetitions }}
        run: bun run test:stability --repetitions "$TEST_REPETITIONS"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-stability
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  full:
    needs: prepare
    if: needs.prepare.outputs.whole == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Verify interactions across the unpartitioned suite
        run: bun run test:full
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-full
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  shell:
    needs: prepare
    if: needs.prepare.outputs.profile == 'full'
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Electron is the shell package's own dependency, never the root's (packages/shell/README.md).
      - run: bun install --cwd packages/shell --frozen-lockfile
      - name: Typecheck the shell
        # src under erasableSyntaxOnly (Electron's Node strips types, nothing more); the tests import
        # daemon helpers that use non-erasable syntax, so they are checked without that flag.
        run: bunx tsc --noEmit -p packages/shell/tsconfig.json && bunx tsc --noEmit -p packages/shell/tsconfig.test.json
      - name: Run the shell's renderer security suite in real Electron
        run: bun run scripts/test-runner.ts shell
      # The desktop app (#371): Electron, Bun and the staged sources in one bundle. Built unsigned
      # (ad hoc) and smoke-tested from an isolated copy whenever a change shapes the bundle
      # (scripts/test-plan.ts classifyApp). Nothing here signs, notarizes or publishes.
      - name: Cache the Electron and Bun downloads for the app build
        if: needs.prepare.outputs.app == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/Library/Caches/glosa-package-app
          key: app-electron-44.4.5-bun-1.4.2-arm64
      - name: Build the unsigned app and smoke it
        if: needs.prepare.outputs.app == 'true'
        run: bun run --cwd packages/shell package -- --arch arm64 --unsigned --smoke
      - name: Keep the unsigned app for inspection
        if: always() && needs.prepare.outputs.app == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-unsigned-arm64
          path: packages/shell/dist/arm64/*.dmg
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-shell
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  ci:
    name: ci
    if: always()
    needs: [prepare, quality, docs, tests, stability, shell, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Require every selected job to succeed
        env:
          TEST_PROFILE: ${{ needs.prepare.outputs.profile }}
          TEST_WHOLE: ${{ needs.prepare.outputs.whole }}
          TEST_RESULTS: ${{ toJSON(needs) }}
        run: bun run scripts/test-plan.ts aggregate

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan bun.lock for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@8ac9e5ce44cc7178e0e04229a91bdcc003166e57 # v2.3.8
        with:
          scan-args: |-
            --lockfile=bun.lock
            --lockfile=packages/shell/bun.lock
