name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full_checks:
        description: Run full checks (manual runs are always full)
        type: boolean
        default: false
      stability_repetitions:
        description: Number of fresh-process stability runs
        type: choice
        options: ['2', '10']
        default: '2'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: macos-14
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      whole: ${{ steps.plan.outputs.whole }}
      repetitions: ${{ steps.plan.outputs.repetitions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.7
      - id: plan
        env:
          TEST_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          TEST_FORCE_FULL: ${{ inputs.force_full_checks }}
          TEST_STABILITY_REPETITIONS: ${{ inputs.stability_repetitions }}
        run: |
          mkdir -p .context/test-results
          bun run scripts/test-plan.ts prepare > .context/test-results/plan.json
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-plan
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  quality:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.7
      - run: bun install --frozen-lockfile
      - name: Lint full repository
        if: needs.prepare.outputs.profile == 'full'
        run: bun run lint
      - name: Typecheck
        if: needs.prepare.outputs.profile == 'full'
        run: bun run typecheck
      - name: Formatting
        run: bun run format:check
      - name: Audit production dependency licenses
        if: needs.prepare.outputs.profile == 'full'
        run: bun run audit:licenses
      - name: Inspect and smoke-test npm tarball
        run: bun run package:check

  docs:
    needs: prepare
    if: needs.prepare.outputs.profile == 'docs'
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.7
      - run: bun install --frozen-lockfile
      - run: bun run test:docs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tests-docs
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  tests:
    needs: prepare
    if: needs.prepare.outputs.profile == 'full'
    runs-on: macos-14
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [acceptance, remaining-1, remaining-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.7
      - run: bun install --frozen-lockfile
      - name: Execute coverage partition
        env:
          TEST_PARTITION: ${{ matrix.profile }}
        run: |
          if [ "$TEST_PARTITION" = acceptance ]; then
            bun run test:acceptance
          else
            bun run scripts/test-runner.ts "$TEST_PARTITION"
          fi
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tests-${{ matrix.profile }}
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  stability:
    needs: prepare
    if: needs.prepare.outputs.profile == 'full'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.7
      - run: bun install --frozen-lockfile
      - name: Repeat ownership and lifecycle checks
        env:
          TEST_REPETITIONS: ${{ needs.prepare.outputs.repetitions }}
        run: bun run test:stability --repetitions "$TEST_REPETITIONS"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tests-stability
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  full:
    needs: prepare
    if: needs.prepare.outputs.whole == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.7
      - run: bun install --frozen-lockfile
      - name: Verify interactions across the unpartitioned suite
        run: bun run test:full
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tests-full
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  ci:
    name: ci
    if: always()
    needs: [prepare, quality, docs, tests, stability, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.7
      - name: Require every selected job to succeed
        env:
          TEST_PROFILE: ${{ needs.prepare.outputs.profile }}
          TEST_WHOLE: ${{ needs.prepare.outputs.whole }}
          TEST_RESULTS: ${{ toJSON(needs) }}
        run: bun run scripts/test-plan.ts aggregate

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan bun.lock for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@8e5cf47b818121e8b405931c82126c2630b0b20d # v2.3.8
        with:
          scan-args: |-
            --lockfile=bun.lock
