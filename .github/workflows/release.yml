name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: macos-14
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      whole: ${{ steps.plan.outputs.whole }}
      repetitions: ${{ steps.plan.outputs.repetitions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - id: plan
        env:
          TEST_FORCE_FULL: "true"
          TEST_STABILITY_REPETITIONS: "2"
        run: |
          mkdir -p .context/test-results
          bun run scripts/test-plan.ts prepare > .context/test-results/plan.json
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-plan
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  quality:
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint full repository
        if: needs.prepare.outputs.profile == 'full'
        run: bun run lint
      - name: Typecheck
        if: needs.prepare.outputs.profile == 'full'
        run: bun run typecheck
      - name: Formatting
        run: bun run format:check
      - name: Audit production dependency licenses
        if: needs.prepare.outputs.profile == 'full'
        run: bun run audit:licenses
      - name: Inspect and smoke-test npm tarball
        run: bun run package:check

  docs:
    needs: prepare
    if: needs.prepare.outputs.profile == 'docs'
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:docs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-docs
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  tests:
    needs: prepare
    if: needs.prepare.outputs.profile == 'full'
    runs-on: macos-14
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [ci-1, ci-2, ci-3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Execute coverage partition
        env:
          TEST_PARTITION: ${{ matrix.profile }}
        run: bun run scripts/test-runner.ts "$TEST_PARTITION"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-${{ matrix.profile }}
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  stability:
    needs: prepare
    if: needs.prepare.outputs.profile == 'full'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Repeat ownership and lifecycle checks
        env:
          TEST_REPETITIONS: ${{ needs.prepare.outputs.repetitions }}
        run: bun run test:stability --repetitions "$TEST_REPETITIONS"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-stability
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  full:
    needs: prepare
    if: needs.prepare.outputs.whole == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Verify interactions across the unpartitioned suite
        run: bun run test:full
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-full
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  shell:
    needs: prepare
    if: needs.prepare.outputs.profile == 'full'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Electron is the shell package's own dependency, never the root's (packages/shell/README.md).
      - run: bun install --cwd packages/shell --frozen-lockfile
      - name: Typecheck the shell
        # src under erasableSyntaxOnly (Electron's Node strips types, nothing more); the tests import
        # daemon helpers that use non-erasable syntax, so they are checked without that flag.
        run: bunx tsc --noEmit -p packages/shell/tsconfig.json && bunx tsc --noEmit -p packages/shell/tsconfig.test.json
      - name: Run the shell's renderer security suite in real Electron
        run: bun run scripts/test-runner.ts shell
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tests-shell
          path: .context/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  ci:
    name: release-ci
    if: always()
    needs: [prepare, quality, docs, tests, stability, shell, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Require every selected job to succeed
        env:
          TEST_PROFILE: ${{ needs.prepare.outputs.profile }}
          TEST_WHOLE: ${{ needs.prepare.outputs.whole }}
          TEST_RESULTS: ${{ toJSON(needs) }}
        run: bun run scripts/test-plan.ts aggregate

  security:
    name: release-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan bun.lock for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@8ac9e5ce44cc7178e0e04229a91bdcc003166e57 # v2.3.8
        with:
          scan-args: |-
            --lockfile=bun.lock
            --lockfile=packages/shell/bun.lock

  release:
    name: release
    # `ci` survives a profile-skipped `docs` with `if: always()`, but a job carrying no condition
    # of its own is gated by an implicit `success()` that walks the whole upstream closure — so
    # this job inherited that skip and never ran, while the workflow still reported success
    # because every job that DID run passed. v0.1.0-alpha.18 was tagged and published nothing.
    # Stating the condition explicitly makes this job depend on its two dependencies' results and
    # nothing else. `released` below turns a non-success here into a red run.
    if: always() && needs.ci.result == 'success' && needs.security.result == 'success'
    needs: [ci, security]
    runs-on: macos-14
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Pin npm bootstrap client
        run: npm install --global npm@11.5.1
      - name: Verify release tag
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          bun run scripts/version-sync.ts --check --expect "${version}"
      - name: Publish package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "${version}" == *-* ]]; then
            dist_tag=alpha
          else
            dist_tag=latest
          fi
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            unset NODE_AUTH_TOKEN
          fi
          npm publish --access public --tag "${dist_tag}" --provenance
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  released:
    name: released
    # The whole point of this job: a SKIPPED `release` contributes nothing to a run's conclusion,
    # so without this the workflow is green when it publishes nothing. That is how alpha.18 was
    # tagged, reported success, and reached neither npm nor GitHub releases.
    # The desktop app (#371) is part of a release: a tag whose npm publish succeeded but whose app
    # build failed is red too.
    if: always()
    needs: [release, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A tagged release must actually publish
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
          APP_RESULT: ${{ needs.app.result }}
        run: |
          if [ "${RELEASE_RESULT}" != "success" ]; then
            echo "release job result: ${RELEASE_RESULT}" >&2
            echo "A tag push that publishes nothing must not report success." >&2
            exit 1
          fi
          if [ "${APP_RESULT}" != "success" ]; then
            echo "app job result: ${APP_RESULT}" >&2
            echo "A tag push whose desktop app did not build and pass its smoke must not report success." >&2
            exit 1
          fi
          echo "release job published (result: ${RELEASE_RESULT}); app job result: ${APP_RESULT}"

  app:
    name: app
    # The desktop app (#371): runs after the GitHub release exists so its assets have somewhere to
    # go. Builds both architectures on the arm64 runner, smokes them, and publishes them with a
    # SHA256SUMS file and a Homebrew tap pull request. With a Developer ID and notarization secrets
    # the app is signed and notarized; without them it is signed ad hoc, which runs everywhere but
    # asks each person to confirm it once in System Settings (docs/release.md). A job-level `if:`
    # cannot read `secrets`, so the `signing` step decides and the two build steps branch on it.
    # APP_SIGNING_REQUIRED set to "true" makes missing secrets fail the job instead.
    if: always() && needs.release.result == 'success'
    needs: [release]
    runs-on: macos-14
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      APP_SIGNING_REQUIRED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Cache Electron, electron-builder and Bun downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/Library/Caches/glosa-package-app
          key: app-electron-44.4.5-bun-1.4.2-all
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install the desktop shell's dependencies
        run: bun install --cwd packages/shell --frozen-lockfile
      - name: Decide whether this run can sign
        id: signing
        env:
          HAS_CSC: ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' }}
          HAS_APPLE: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          if [ "${HAS_CSC}" = "true" ] && [ "${HAS_APPLE}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "${APP_SIGNING_REQUIRED}" = "true" ]; then
            echo "Developer ID or notarization secrets are missing and signing is required." >&2
            exit 1
          else
            echo "::notice::No Developer ID secrets; publishing an ad-hoc signed app. People confirm it once in System Settings (docs/release.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build, sign, notarize and smoke both architectures
        if: steps.signing.outputs.enabled == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run --cwd packages/shell package -- --arch all --smoke
      - name: Build and smoke an ad-hoc signed app
        if: steps.signing.outputs.enabled != 'true'
        run: bun run --cwd packages/shell package -- --arch all --unsigned --smoke
      - name: Write SHA256SUMS
        run: |
          cd packages/shell/dist
          shasum -a 256 arm64/*.dmg arm64/*.zip x64/*.dmg x64/*.zip | sed -E 's#  [a-z0-9]+/#  #' > SHA256SUMS
          cat SHA256SUMS
      - name: Upload the app to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            packages/shell/dist/arm64/*.dmg packages/shell/dist/arm64/*.zip \
            packages/shell/dist/x64/*.dmg packages/shell/dist/x64/*.zip \
            packages/shell/dist/SHA256SUMS --clobber
      - name: Update the Homebrew tap
        env:
          # A deploy key with write access to davebream/homebrew-tap only (docs/release.md).
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; bump the tap by hand (docs/release.md)."
            exit 0
          fi
          # Only a notarized app may drop the cask's quarantine instructions.
          notarized=""
          if [ "${SIGNED}" = "true" ]; then notarized="--notarized"; fi
          bun run scripts/cask-bump.ts --version "${GITHUB_REF_NAME#v}" --sums packages/shell/dist/SHA256SUMS ${notarized}
